name: Build EE4435 report PDF

on:
  push:
    branches: [main, "report/**"]
  pull_request:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out report source and assets
        uses: actions/checkout@v4
      - name: Verify exploratory extraction against archived results
        run: |
          python3 tools/gm_dibl_exploratory.py --input data/part4_idvg_all.csv --output /tmp/part4_gm_result.csv
          python3 - <<'PY'
          import csv, math
          def read(path):
              with open(path, newline="") as f:
                  return {r["case"]: r for r in csv.DictReader(f)}
          expected = read("data/part4_elr_esr_sensitivity.csv")
          actual = read("/tmp/part4_gm_result.csv")
          assert set(expected) == set(actual) == {"3e15", "3e16", "3e17", "3e18"}
          columns = ["ELR_low_VTH_V", "ESR_high_VTH_V",
              *[f"DIBL_apparent_w{k}_mV_per_V" for k in (3,5,7,9)]]
          for key in expected:
              assert actual[key]["fit_peak_at_search_boundary"] == "False", key
              for field in columns:
                  assert abs(float(actual[key][field])-float(expected[key][field])) < 0.00001, (key,field)
              assert float(actual[key]["low_fit_R2"]) > 0.999
              assert float(actual[key]["high_fit_R2"]) > 0.999
          print("PASS: Part 4 ELR/ESR numerical cross-check and fitted-window audit")
          PY
      - name: Validate Part 3 reported ELR/ESR values against original current metrics
        run: |
          python3 - <<'PY'
          import csv
          def records(path, key):
              with open(path, newline="") as f:
                  return {int(float(r[key])): r for r in csv.DictReader(f)}
          alt = records("data/part3_elr_esr_terminal_summary_20261027.csv","TANNEAL_C")
          original = records("data/part3_temperature_metrics.csv","TANNEAL_C")
          marker = records("data/part3_common_current_switching.csv","TANNEAL_C")
          assert sorted(alt) == sorted(original) == sorted(marker) == [800,850,900,950,1000]
          for temp, row in alt.items():
              old = original[temp]
              for a,b in (("ION_high_exported","ION_exported"),
                          ("IOFF_high_exported","IOFF_exported")):
                  v1,v2=float(row[a]),float(old[b])
                  assert abs(v1-v2) <= 1e-5 * max(abs(v1),abs(v2)), (temp,a,v1,v2)
              lo,hi = float(row["VTH_ELR_0p1_V"]),float(row["VTH_ESR_1p2_V"])
              apparent = float(row["DIBL_ELR_ESR_app_mV_perV"])
              assert abs(apparent-1000*(lo-hi)/1.1) < 0.1, temp
              assert float(row["DIBL_window_min_mV_perV"]) <= apparent <= float(row["DIBL_window_max_mV_perV"])
              assert float(row["R2_low_5pt"]) > 0.999
              assert float(row["R2_high_5pt"]) > 0.999
          # The method discrepancy is expected, not an accidental unit conversion.
          assert float(alt[950]["DIBL_ELR_ESR_app_mV_perV"]) > float(alt[800]["DIBL_ELR_ESR_app_mV_perV"])
          assert float(marker[950]["DrainShift_mV_per_V"]) < float(marker[800]["DrainShift_mV_per_V"])
          print("PASS: Part 3 terminal summary internally consistent and ION/IOFF match archived metrics")
          print("LIMIT: this check does not re-extract the NUS-only original PLT curves")
          PY
      - name: Compile main.tex with pdfLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error -file-line-error"
      - name: Publish compiled PDF for visual review
        uses: actions/upload-artifact@v4
        with:
          name: EE4435_report_pdf
          path: main.pdf
          if-no-files-found: error
